<span class="truncate" [style.max-width]="maxWidth ? maxWidth + 'px' : null" [style.justify-content]="textAlign" [class.inline]="inline">
    <ng-container *ngIf="link">
      <a *ngIf="nativeBlockLink; else routerLinkTemplate" [tonBlockLink]="nativeBlockLink" class="truncate-link" [target]="external ? '_blank' : '_self'" [class.disabled]="disabled">
        <ng-container *ngIf="rtl; then rtlTruncated; else ltrTruncated;"></ng-container>
      </a>
      <ng-template #routerLinkTemplate><a [routerLink]="link" [queryParams]="queryParams" class="truncate-link" [target]="external ? '_blank' : '_self'" [class.disabled]="disabled">
        <ng-container *ngIf="rtl; then rtlTruncated; else ltrTruncated;"></ng-container>
      </a></ng-template>
    </ng-container>
    <ng-container *ngIf="!link">
      <ng-container *ngIf="rtl; then rtlTruncated; else ltrTruncated;"></ng-container>
    </ng-container>
    <ng-content></ng-content>
</span>

<ng-template #ltrTruncated>
  <ng-container *ngIf="isEthereumAddress; else standardLtrTruncated">
    <span class="last-four">{{ text.slice(0, 4) }}</span><span class="ethereum-ellipsis">...</span><span class="last-four">{{ text.slice(-6) }}</span>
  </ng-container>
  <ng-template #standardLtrTruncated><span class="first">{{text.slice(0,-lastChars)}}</span><span class="last-four">{{text.slice(-lastChars)}}</span></ng-template>
  <div class="hidden-content">{{ text }}</div>
</ng-template>

<ng-template #rtlTruncated>
  <span class="first">{{text.slice(lastChars)}}</span><span class="last-four">{{text.slice(0,lastChars)}}</span>
  <div class="hidden-content">{{ text }}</div>
</ng-template>
