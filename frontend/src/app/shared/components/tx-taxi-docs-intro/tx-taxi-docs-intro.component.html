<section class="taxi-docs-intro" [attr.aria-label]="copy.aboutLabel">
  <div class="taxi-docs-art" aria-hidden="true"></div>
  <div class="taxi-docs-copy">
    <p class="taxi-docs-eyebrow">tx.taxi <span aria-hidden="true">/</span> {{ chainName }} {{ localizedContext }}</p>
    <h2 i18n="@@ton.about.29d606cfd689">One search across chains.</h2>
    <p i18n="@@ton.about.8dc06a59d879">Paste a transaction, block or address into tx.taxi. Open a confirmed match, choose between possible networks, or head straight to your chain’s explorer.</p>
    <div class="taxi-docs-actions">
      <a class="taxi-docs-button" href="https://tx.taxi/">{{ copy.introAction }} <span aria-hidden="true">↗︎</span></a>
      <a class="taxi-docs-native" href="./" [attr.aria-label]="copy.open + ' ' + chainHost">{{ copy.explore }} {{ chainName }} <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
