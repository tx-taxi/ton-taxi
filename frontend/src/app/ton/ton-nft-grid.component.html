<div class="nft-grid">
  <a
    class="card nft-card"
    *ngFor="let item of items; trackBy: trackItem"
    [routerLink]="['/' + itemKind, item.address]"
  >
    <div class="nft-image" [class.media-pending]="item.image">
      <div
        *ngIf="item.image"
        class="skeleton-loader media-skeleton"
        aria-hidden="true"
      ></div>
      <span *ngIf="!item.image" class="no-image" i18n="@@ton.fc5e5bdcd5f6">No image</span>
      <span *ngIf="item.image" class="image-unavailable-label" i18n="@@ton.extra.image-unavailable">Image unavailable</span>
      <img
        *ngIf="item.image"
        [src]="item.image"
        alt=""
        loading="lazy"
        referrerpolicy="no-referrer"
        (load)="imageLoaded($event)"
        (error)="hideImage($event)"
      />
    </div>
    <div class="card-body">
      <strong>{{ item.name }}</strong>
      <small *ngIf="item.collectionLabel">{{ item.collectionLabel }}</small>
      <small *ngIf="item.sale"
        ><span i18n="@@ton.extra.for-sale">For sale</span> · <app-amount [amount]="item.sale"></app-amount
      ></small>
      <small *ngIf="item.flagged" class="text-danger" i18n="@@ton.f8db8a172be6">Flagged</small>
    </div>
  </a>
</div>
