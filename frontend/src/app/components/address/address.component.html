<div class="container-xl native-account-page">
  <div class="title-address">
    <h1>Account</h1>
    <div class="tx-link">
      <app-truncate
        [text]="addressString"
        [lastChars]="8"
        [link]="['/address', addressString]"
      >
        <button
          type="button"
          class="qrSpan btn btn-link p-0"
          (click)="showQR = !showQR"
          [attr.aria-expanded]="showQR"
          aria-label="Show account QR code"
        >
          <fa-icon [icon]="['fas', 'qrcode']" [fixedWidth]="true"></fa-icon>
          <span class="qr-wrapper" *ngIf="showQR"
            ><app-qrcode [size]="200" [data]="addressString"></app-qrcode
          ></span>
        </button>
        <app-clipboard [text]="addressString"></app-clipboard>
      </app-truncate>
    </div>
  </div>
  <div class="clearfix"></div>

  <div
    *ngIf="error && !account"
    class="ethereum-address-history-state"
    role="alert"
  >
    <div>
      <strong>Account unavailable</strong><span>{{ error }}</span>
    </div>
    <button class="btn btn-sm btn-outline-info ms-auto" (click)="retry.emit()">
      Retry
    </button>
  </div>
  <div
    *ngIf="isLoadingAddress && !account"
    class="box"
    role="status"
    aria-label="Loading account"
  >
    <div class="row">
      <div class="col-sm" *ngFor="let column of [0, 1]">
        <table class="table table-borderless table-striped address-table">
          <tbody>
            <tr *ngFor="let row of [0, 1, 2]">
              <td><span class="skeleton-loader"></span></td>
              <td><span class="skeleton-loader"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <ng-container *ngIf="account as view">
    <section class="ethereum-address-profile" aria-label="TON account identity">
      <app-ethereum-identity
        [entity]="view.identity"
        chainName="TON"
        chainSymbol="GRAM"
      ></app-ethereum-identity>
      <div class="ethereum-address-meta">
        <span class="badge badge-warning" *ngIf="view.stale"
          >Updates delayed</span
        ><a
          *ngFor="let domain of view.domains"
          class="ethereum-address-meta__item ethereum-address-meta__link"
          [routerLink]="['/dns', domain]"
          ><span>TON DNS</span><strong>{{ domain }}</strong></a
        >
      </div>
    </section>
    <div class="box">
      <div class="row">
        <div class="col-sm">
          <table class="table table-borderless table-striped address-table">
            <tbody>
              <tr>
                <td>Balance</td>
                <td class="text-wrap">
                  <app-amount [amount]="view.balance"></app-amount>
                </td>
              </tr>
              <tr>
                <td>Status</td>
                <td>{{ view.status || "Unknown" }}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="col-sm mobile-bottomcol">
          <table class="table table-borderless table-striped address-table">
            <tbody>
              <tr>
                <td>Last activity</td>
                <td>
                  <app-timestamp
                    *ngIf="view.lastActivity; else unknownActivity"
                    [unixTime]="view.lastActivity"
                  ></app-timestamp
                  ><ng-template #unknownActivity>—</ng-template>
                </td>
              </tr>
              <tr>
                <td>Contract</td>
                <td class="text-wrap">
                  {{
                    view.interfaces.length ? view.interfaces.join(", ") : "—"
                  }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <ng-content></ng-content>
  </ng-container>
</div>
