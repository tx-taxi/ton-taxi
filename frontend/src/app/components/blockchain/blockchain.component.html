<div class="text-center blockchain-wrapper" [class.time-ltr]="timeLtr" [class.ltr-transition]="ltrTransitionEnabled" #container>
  <div #positionContainer class="position-container" [ngClass]="network ? network : ''" [style]="positionStyle">
    <span>
      <div class="blocks-wrapper">
        <div class="scroll-spacer" *ngIf="minScrollWidth" [style.left]="minScrollWidth + 'px'"></div>
        <app-mempool-blocks *ngIf="!nativeContext && !deferInitialPageLoad && !historicalDetailView && pageIndex === 0" [allBlocks]="scrollableMempool" (widthChange)="onMempoolWidthChange($event)"></app-mempool-blocks>
        <app-blockchain-blocks *ngIf="nativeContext" [static]="true" [offset]="40" [suppliedBlocks]="nativeContext.blocks" [suppliedLoading]="nativeContext.loading" [suppliedSelectedBlockId]="nativeContext.targetId" [suppliedBoundarySlots]="nativeContext.boundarySlots || []"></app-blockchain-blocks>
        <app-blockchain-blocks *ngIf="!nativeContext && !deferInitialPageLoad && !historicalDetailView && pageIndex === 0"></app-blockchain-blocks>
        <ng-container *ngFor="let page of (nativeContext ? [] : pages); trackBy: trackByPageFn">
          <app-blockchain-blocks [static]="true" [offset]="page.offset" [height]="page.height" [count]="blocksPerPage" [loadingTip]="loadingTip" [connected]="connected"></app-blockchain-blocks>
        </ng-container>
      </div>
      <div id="divider" [hidden]="pageIndex > 0 || !!nativeContext">
        <a class="chain-divider-mark" [routerLink]="['/' | relativeUrl]" aria-label="TON explorer dashboard" i18n-aria-label="@@ton.a11y.dashboard"><img src="/resources/branding/ton-divider.png" alt=""></a>
        <button
          type="button"
          class="block-display-toggle"
          (click)="toggleBlockDisplayMode()"
          [attr.aria-label]="blockDisplayMode === 'fees'
            ? showTransactionCountsLabel
            : showBlockFeesLabel"
          [attr.title]="blockDisplayMode === 'fees'
            ? showTransactionCountsLabel
            : showBlockFeesLabel">
          <fa-icon [icon]="['fas', 'exchange-alt']" [fixedWidth]="true"></fa-icon>
        </button>

        <button
          type="button"
          class="time-toggle"
          (click)="toggleTimeDirection()"
          [attr.aria-label]="timeLtr
            ? newestRightLabel
            : newestLeftLabel"
          [attr.title]="timeLtr
            ? newestRightLabel
            : newestLeftLabel">
          <fa-icon [icon]="['fas', 'exchange-alt']" [fixedWidth]="true"></fa-icon>
        </button>
      </div>
    </span>
  </div>
</div>
