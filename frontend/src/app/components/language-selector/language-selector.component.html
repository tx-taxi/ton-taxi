<div [formGroup]="languageForm" class="text-small text-center">
    <select formControlName="language" class="form-select form-select-sm form-control-secondary form-control mx-auto" style="width: 120px;" (change)="changeLanguage()" aria-label="Language" i18n-aria-label="@@ton.preferences.language">
        <option *ngFor="let lang of languages" [value]="lang.code">{{ lang.name }}</option>
    </select>
</div>
