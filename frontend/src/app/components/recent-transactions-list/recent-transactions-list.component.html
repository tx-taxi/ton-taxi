<button *ngIf="!nativeMode && !widget && (bufferedCount$ | async) > 0 && !(manualPaused$ | async)"
  type="button"
  class="new-tx-pill"
  (click)="scrollToTop()"
  data-cy="new-tx-pill">
  <fa-icon [icon]="['fas', 'angle-up']" [fixedWidth]="true"></fa-icon>
  <span *ngIf="(bufferedCount$ | async) === 1" i18n="recent-transactions.new-tx-pill.singular">1 new transaction</span>
  <span *ngIf="(bufferedCount$ | async) > 1" i18n="recent-transactions.new-tx-pill.plural">{{ bufferedCount$ | async }} new transactions</span>
</button>

<div [class.container-xl]="!widget" [class.widget]="widget" [style.min-height.px]="widget ? null : 335">
  <div class="title-row" *ngIf="!widget">
    <h1 i18n="page.recent-transactions">Recent Transactions</h1>

    <div class="controls" *ngIf="!nativeMode">
      <div class="btn-group" role="group">
        <button *ngFor="let limit of limitOptions"
          type="button"
          class="btn btn-primary btn-sm"
          [class.active]="(limit$ | async) === limit"
          [attr.data-cy]="'limit-' + limit"
          (click)="setLimit(limit)">
          {{ limit }}
        </button>
      </div>
      <button class="btn btn-primary btn-sm btn-pause" [class.active]="manualPaused$ | async" (click)="togglePause()" title="Pause/Resume" i18n-title="recent-transactions.pause-toggle.title|Tooltip for the pause/resume updates button" aria-label="Pause/Resume" i18n-aria-label="recent-transactions.pause-toggle.aria-label|Accessible label for the pause/resume updates button" data-cy="btn-pause">
        <fa-icon [icon]="['fas', (manualPaused$ | async) ? 'play' : 'pause']" [fixedWidth]="true"></fa-icon>
      </button>
    </div>
  </div>

  <div *ngIf="nativeRoute && native.error" class="alert alert-mempool">{{ native.error }}</div>
  <table class="table latest-transactions">
    <thead>
      <th class="table-cell-txid" i18n="dashboard.latest-transactions.txid">TXID</th>
      <th class="table-cell-satoshis">Value</th>
      <th class="table-cell-vsize" *ngIf="!widget">{{ nativeMode ? 'Messages' : 'Gas used' }}</th>
      <th class="table-cell-fees">{{ nativeMode ? 'Fees' : 'Gas price' }}</th>
    </thead>
    <tbody data-cy="transactions-list" *ngIf="(nativeMode ? rows : (transactions$ | async)) as transactions; else skeleton">
      <tr *ngFor="let transaction of transactions; trackBy: trackByTxid">
        <td class="table-cell-txid">
          <a [class.text-danger]="nativeMode && transaction.success === false" [title]="nativeMode && transaction.success === false ? 'Failed transaction' : ''" [routerLink]="['/tx' | relativeUrl, (transaction.hash || transaction.txid)]">
            <app-truncate [text]="transaction.hash || transaction.txid" [lastChars]="5"></app-truncate>
          </a>
        </td>
        <td class="table-cell-satoshis">
          <app-amount *ngIf="!nativeMode && (network$ | async) !== 'liquidtestnet'" [satoshis]="transaction.value" digitsInfo="1.2-4" [noFiat]="true"></app-amount>
          <span *ngIf="!nativeMode && (network$ | async) === 'liquidtestnet'">Confidential</span><app-amount *ngIf="nativeMode" [amount]="native.coin(transaction.in_msg?.value)" [compactBlock]="widget" [noFiat]="true"></app-amount>
        </td>
        <td class="table-cell-vsize" *ngIf="!widget"><ng-container *ngIf="!nativeMode">{{ transaction.vsize | number }} gas</ng-container><ng-container *ngIf="nativeMode">{{ (transaction.in_msg ? 1 : 0) + (transaction.out_msgs?.length || 0) }}</ng-container></td>
        <td class="table-cell-fees">
          <app-amount *ngIf="nativeMode" [amount]="native.coin(transaction.total_fees)" [compactBlock]="widget" [noFiat]="true"></app-amount><app-fee-rate *ngIf="!nativeMode" [fee]="transaction.fee" [weight]="transaction.vsize * 4"></app-fee-rate>
        </td>
      </tr>
      <tr *ngIf="!nativeMode && !widget && transactions.length < (limit$ | async)" data-cy="transactions-skeleton-row">
        <td class="table-cell-txid"><span class="skeleton-loader"></span></td>
        <td class="table-cell-satoshis"><span class="skeleton-loader"></span></td>
        <td class="table-cell-vsize"><span class="skeleton-loader"></span></td>
        <td class="table-cell-fees"><span class="skeleton-loader"></span></td>
      </tr>
    </tbody>
    <ng-template #skeleton>
      <tbody>
        <tr *ngFor="let i of (widget ? [1,2,3,4,5,6] : [1])">
          <td class="table-cell-txid"><span class="skeleton-loader"></span></td>
          <td class="table-cell-satoshis"><span class="skeleton-loader"></span></td>
          <td class="table-cell-vsize" *ngIf="!widget"><span class="skeleton-loader"></span></td>
          <td class="table-cell-fees"><span class="skeleton-loader"></span></td>
        </tr>
      </tbody>
    </ng-template>
  </table>
  <div class="d-flex justify-content-center gap-2 my-4" *ngIf="nativeRoute && native.data"><button class="btn btn-primary" *ngIf="native.data._paging?.hasMore" [disabled]="native.mainLoading" (click)="native.loadMoreMain()">{{ native.mainLoading ? 'Loading…' : 'Load more' }}</button><button class="btn btn-outline-primary" (click)="native.load()">Latest</button></div><div class="alert alert-mempool" *ngIf="nativeRoute && native.mainError">{{ native.mainError }}</div>
</div>
